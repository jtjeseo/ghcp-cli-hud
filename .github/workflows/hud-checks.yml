name: HUD checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null; then brew install --cask powershell; fi
          if ! command -v jq >/dev/null; then brew install jq; fi
      - name: Node fixtures
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -LiteralPath .\tests -Filter '*.test.mjs').FullName)
          node --test @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable renderer and setup fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'hud-install-scripts', 'hud-setup-fixtures', 'hud-json-fixtures', 'statusline-git-fixtures',
              'statusline-signal-fixtures', 'statusline-quota-fixtures', 'statusline-quota-shared-fixtures') {
            & pwsh -NoProfile -File (Join-Path .\tests ($name + '.ps1'))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows PowerShell compatibility fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'hud-install-scripts', 'hud-setup-fixtures', 'hud-json-fixtures',
              'hud-powershell51-fixtures', 'statusline-git-fixtures', 'statusline-quota-fixtures',
              'statusline-quota-shared-fixtures', 'hud-launcher-environment',
              'hud-aic-validation-inspector', 'state-hook-powershell51-fixtures') {
            & powershell.exe -NoProfile -File (Join-Path .\tests ($name + '.ps1'))
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows 5.1 signal renderer fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HUD_TEST_POWERSHELL = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & pwsh -NoProfile -File .\tests\statusline-signal-fixtures.ps1
          exit $LASTEXITCODE
      - name: Native macOS Bash fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: /bin/bash ./tests/hud-bash-fixtures.sh
